// 鼠标灵敏度。
// 默认值:1.25
//
// <i> 灵敏度换算:新灵敏度 = (当前 DPI × 当前灵敏度) / 新 DPI
// <i> 居中的 eDPI 通常平均在 800 左右。
sensitivity "1.4"

// 开镜(FOV 缩放)时应用的额外鼠标灵敏度缩放系数。
// 默认值:1
//
// <-> 灵敏度会根据武器脚本收窄视野(FOV)的程度而降低。
//
// <i> 值 '0.82' 需要瞄准者更少的鼠标移动变化,是正确焦距换算。
zoom_sensitivity_ratio "0.82"

// 鼠标俯仰系数。
// 默认值:0.022
//
// 垂直速度灵敏度乘数(Y 轴)。
m_pitch "0.022"

// 鼠标偏航系数速度灵敏度乘数。
// 默认值:0.022
//
// <-> 水平速度灵敏度乘数(X 轴)。
//
// <i> 在两种纵横比下做相同的鼠标移动会获得相同的转向角度,
// 但 4:3 的感觉会非常不同,因为同样的转向在更小的 FOV 中占据更大的比例,
// 因此看起来光标移动得更快、更远。
m_yaw "0.022"
