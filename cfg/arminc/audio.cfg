// 音量。
// 默认值:1
volume "0.64"

// 选择耳机 EQ 预设。
// 默认值:0
//
// >> 改变整体声音音染。有助于抵消各种硬件和软件组合造成的音染。
//
// <> >> 数值:
// 0:自然;
//    无额外音染。
//
// 1:清脆;
//    增强中高频段。有助于声音定位并减少发闷感。在某些情况下可能听起来刺耳。
//
// 2:平滑;
//    降低中高频。有助于减少刺耳感、音量尖峰和长时间游玩时的听觉疲劳。
//    适合录音室级耳机以及音量开得较大的玩家。
snd_headphone_eq "0"

// 左右声道隔离。
// 默认值:0
//
// <> >> 数值:
// 0:物理准确;
//    物理建模的声音声像行为,最准确地反映发声源的位置。
// /\
// ||
// \/
//
// 1:左右隔离;
//    位于玩家正侧方的声音源将被硬声像化,很少混合到相反的左右声道中。
//    这提供了强烈的左右感,但在某些角度上可能造成位置误导。
//    适合喜欢传统声音声像行为的玩家。
//
// <i> 较高的值会以二元方式将声音按比例导向完全来自特定方向,而较低的值会以自然的 3D 方式让声音回荡。
snd_spatialize_lerp "0.5"

// 3D 音频的透视校正。
// 默认值:1
//
// <> >> 数值:
// 0:禁用;
//    视野边缘的声音源将强烈声像化为左或右。适合屏幕前坐得很近、使用穿戴式屏幕、
//    或喜欢传统声音引擎的玩家。在某些角度上可能造成位置误导。
//
// 1:启用;
//    看向 PC 屏幕时,声音源将按照视野准确渲染。视野边缘的声音源听起来略微靠前。
//    屏幕外且位于正侧方的声音源将完全声像化为左或右。
snd_steamaudio_enable_perspective_correction "1"

// 调整 Steam Audio 混响处理器输出的整体音量(dB)。
// 默认值:-3
snd_steamaudio_reverb_level_db "-3"

// 自动缓冲延迟检测(需要驱动支持)。
// 默认值:1
//
// <!> 禁用可能导致音频丢失等不良效果。
snd_autodetect_latency "1"

// 规定音频系统处理声音的时间。
// 默认值:0.001
//
// <!> 任何更高的值都可能使声音出错。
snd_mixahead "0.001"

// 主菜单音乐的音量。
// 默认值:0.04
snd_menumusic_volume "0.04"

// 地图背景音的音量。
// 默认值:1.0
snd_menumap_volume "0.8"

// 回合开始音乐的音量。
// 默认值:0
snd_roundstart_volume "0"

// 回合结束音乐的音量。
// 默认值:0.16
snd_roundend_volume "0"

// 地图目标音乐的音量。
// 默认值:0.0225
snd_mapobjective_volume "0"

// 死亡镜头音乐的音量。
// 默认值:0.16
snd_deathcamera_volume "0"

// 十秒警告音乐的音量。
// 默认值:0.0225
//
// <i> 可帮助用作计时机制,判断炸弹何时爆炸,从而知道是否有时间拆弹。
snd_tensecondwarning_volume "0.12"

// MVP 音乐的音量。
// 默认值:0.16
snd_mvp_volume "0.12"

// 如果双方队伍仍有存活玩家,则静音 MVP 音乐。
// 默认值:0
//
// <i> 有助于在回合结束后听到脚步声。
snd_mute_mvp_music_live_players "1"

// 游戏失去焦点(切出)时禁用游戏声音。
// 默认值:1
snd_mute_losefocus "1"

// 工具(如 Hammer、SFM)中声音的音量。
// 默认值:1
//
// <i> 可与 'play' 命令结合使用。
snd_toolvolume "0.3"

// 嵌入式流媒体音频音量。
// 默认值:0
cl_embedded_stream_audio_volume "0"

// 嵌入式流媒体音频音量乘以主音量。
// 默认值:1
cl_embedded_stream_audio_volume_xmaster "1"

// 传入语音的音量级别。
// 默认值:1
//
// >> 语音通话的整体音量。
// <i> 调整游戏中所有语音通信的整体音量。
snd_voipvolume "0.72"

// 屏蔽敌方队伍玩家的所有通讯。
// 默认值:0
cl_mute_enemy_team "0"

// 仅允许来自好友和匹配队伍成员的通讯。
// 默认值:0
//
// >> 屏蔽除好友或匹配队伍成员之外的所有人的通讯。
//
// <> 数值:
// 0:禁用
// 1:适用于非竞技游戏模式。
// 2:适用于所有模式。
cl_mute_all_but_friends_and_party "0"

// 静音语音和其他干扰声音,直到回合结束或下次死亡。
// 默认值:0
cl_clutch_mode "0"

// 通过麦克风插孔收听已连接的设备。
// 默认值:0
//
// <-> 如果连接了麦克风,将播放反馈音(镜像声音)。
voice_loopback "0"

// 使用语音激活(而非"按键说话")时,麦克风的灵敏度(分贝阈值)。
// 默认值:-120
//
// <-> 拾取声音所需的音量级别。
voice_threshold "-110"

// 启用麦克风。
// 默认值:1
voice_modenable "1"

// 应用程序启动时打开 VOIP 音频输入流。
// 默认值:0
//
// >> 游戏启动时打开录音设备,而不是首次使用麦克风时才打开。
// <!> 可能解决麦克风传输问题。
voice_always_sample_mic "0"

// 用于语音采集的默认设备。
// 默认值:0
voice_device_override "0"
