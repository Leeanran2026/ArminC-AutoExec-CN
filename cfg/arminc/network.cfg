// 主机每秒可接收的最大字节数。
// 默认值:786432
//
// >> 允许指定在线游戏服务器在游戏过程中发送给客户端的游戏流量带宽。
// <!> >> 如果互联网服务提供商或路由器丢弃网络数据包,较低的带宽设置有助于避免丢包。
// <!> >> 带宽设置不足会导致游戏服务器通过互联网向客户端发送玩家更新时,网络数据包延迟。
//
// <> 数值:
// [最低] 0.7 Mbps:  98304
//   |    1.0 Mbps: 131072
//   |    1.5 Mbps: 196608
//   |    2.0 Mbps: 262144
//   |    2.5 Mbps: 327680
//   |    3.0 Mbps: 393216
//   |    4.0 Mbps: 524288
//   |    5.0 Mbps: 655360
//   |    6.0 Mbps: 786432
// [最高] 7.6 Mbps: 1000000
//
// <!> 值 '1000000' 在游戏内会被错误报告为"限制极为严格",而实际上它应该是最高的。
rate "1000000"

// 服务器快照和用户命令的延迟 tick 数。
// 默认值:0
//
// <> 数值:
// 0:停用实体插值。适用于稳定的连接(几乎没有丢包)。
// 1:将实体插值时间降至最低。遇到轻微丢包或阻塞(轻微数据包丢失)时使用。
// 2:在 2 个快照之间插值,以避免偶尔丢失一个快照的问题。遇到严重丢包或阻塞(高数据包丢失)时使用。
//
// <i> 常见插值值计算:
// Tickrate  64: cl_interp_ratio 0 / cl_updaterate 64  = lerp  0.000 ->  ~0.0ms 插值时间;
// Tickrate  64: cl_interp_ratio 1 / cl_updaterate 64  = lerp 15.625 -> ~15.6ms 插值时间;
// Tickrate  64: cl_interp_ratio 2 / cl_updaterate 64  = lerp 31.250 -> ~31.3ms 插值时间;
//
// <i> 当游戏客户端遇到来自服务器的信息缺失且插值历史不足以估算缺失数据的替代值时,会执行外推。
// 在这种情况下,游戏客户端会采用最不差的选择:假设所有物体都将保持当前方向并沿完美直线移动。
// 然而,这种简单假设很少与现实中物体的实际移动一致。因此,当下一个服务器更新到达时,
// 物体突然移动到其应有位置,产生明显的突兀跳动。
//
// >> 缓冲来自服务器的快照和来自客户端的命令。
// <i> >> 它减少了丢包造成的卡顿,但增加了有效延迟。
// <!> >> 控制 'cl_interp_ratio' 的值以及默认的 'cl_interp',不应直接修改。
// <i> 与主要影响接收数据插值的插值比率修改器不同,这会直接增加所缓冲 tick 数对应的输入延迟。
// <i> 可以通过结合使用 'cl_hud_telemetry_net_quality_graph_show' 来评估情况。如果抖动超过高阈值
// (灰色线),可以增加缓冲区,代价是额外的延迟,这可能不如游戏卡顿让人接受。
cl_net_buffer_ticks "0"

// 数据包在收到时立即处理,并使用 cl_interp 延迟其效果,而不是通过调整时钟同步缓冲数据包来平滑丢包。
// 默认值:1
cl_net_buffer_ticks_use_interp "1"

// 输出 tick 数据包的期望队列长度,影响添加到接收余量的缓冲时间。
// 默认值:1
//
// <> 数值:
//  0:在默认接收余量之外不添加额外缓冲。
//  1-2:添加少量缓冲以平滑游戏体验,而不会带来太多输入延迟。
//  3+:实现更大的缓冲,以在不稳定连接下保持更平滑的游戏体验,但可能会增加输入延迟。
cl_tickpacket_desired_queuelength "0"

// 预测身体射击的视听效果,如血溅和音效。
// 默认值:0
//
// <!> >> 伤害预测会让射击感觉明显更灵敏,但偶尔会有预测错误的风险
// (例如由于受击上抬、减速,或你的客户端还不知道的死亡)。
// <i> >> 高延迟时伤害预测不生效。
cl_predict_body_shot_fx "1"

// 预测头部射击的视听效果,如火花和叮当声。
// 默认值:0
cl_predict_head_shot_fx "1"

// 当击杀被预测时,目标立即变为布娃娃状态。
// 默认值:0
//
// <i> >> 如果预测错误,目标会弹回其服务器权威位置。
// <!> 可能会误导你确认击杀,在关键的瞬间做出错误决定。
cl_predict_kill_ragdolls "0"

// 让客户端选择中继并通过该中继通信。
// 默认值:0
//
// <> 数值:
//  0:使用 GC(Game Coordinator)请求的连接方式。
// >0:尽可能始终使用 SDR。
// <0:尽可能始终使用直接 UDP。
net_client_steamdatagram_enable_override "1"

// 服务质量(QoS)超时(无响应)秒数。
// 默认值:15
mm_session_search_qos_timeout "20"

// 官方服务器游戏可接受的最长首选延迟。
// 默认值:150
//
// >> 允许指定在官方匹配服务器上搜索游戏时的最大可接受匹配延迟。
// <i> >> 如果有满足延迟设置的官方服务器,匹配将始终连接到托管在这些服务器上的比赛。
// <i> >> 如果附近没有官方服务器,匹配将连接到延迟更高的次近官方服务器上的比赛。
mm_dedicated_search_maxping "40"

// 执行 CS:GO 社区匹配时,查找至少拥有这么多真人玩家的服务器。
// 默认值:3
mm_csgo_community_search_players_min "3"

// 客户端重新发送 'connect' 尝试之前的延迟秒数。
// 默认值:0.5
//
// <!> 仅在加入服务器之前生效。
cl_resend "0.5"

// 在未收到服务器数据包的情况下断开连接的延迟秒数。
// 默认值:30
cl_timeout "30"

// 大厅默认权限。
// 默认值:1
//
// <> 数值:
// 0:私密
// 1:公开
lobby_default_privacy_bits2 "0"

// 用户自动宣传邀请。
// 默认值:1
//
// <> 数值:
// 0:禁用
// 1:最后
// 2:自动
ui_setting_advertiseforhire_auto "1"

// 向 Steam 好友宣传可加入的进行中游戏,否则需要 Steam 邀请。
// 默认值:1
//
// <> 数值:
// 0:无 - 好友只能通过邀请加入游戏。
// 1:官方服务器 - 好友只能在官方服务器上加入游戏。
// 2:所有服务器 - 好友可以在官方和社区服务器上加入游戏。
cl_join_advertise "2"

// 忽略来自最近队友或其他非好友的游戏内邀请。
// 默认值:0
cl_invites_only_friends "0"

// 用户正在比赛时忽略所有邀请。
// 默认值:0
cl_invites_only_mainmenu "0"
