// 屏幕伽马值(仅在全屏模式下)。
// 默认值:2.2
//
// >> 改变显示的伽马校正,调整整体亮度。
// <i> 较低的值能让玩家更容易发现黑暗角落里的敌人。
//
// <> 数值:
// 1.6:最亮。
// |
// 2.6:最暗。
r_fullscreen_gamma "2.2"

// 帧率限制器。
// 默认值:400
//
// <-> 帧率上限的主要好处是让帧率更稳定。中等且一致的帧率远比可变但偶尔很高的帧率理想。
// 生成的高于显示器刷新率的帧仍然有用,可提供更稳定的游戏体验。
//
// <!> 限制帧率可用于规避极高帧率下的错误和其他影响。
// <i> 较高的值可以提高流畅度,但同时更耗电。
fps_max "240"

// 显示游戏 UI 时的帧率限制器。
// 默认值:200
//
// <i> 与 'fps_max' 相同,但仅适用于主菜单。
fps_max_ui "200"

// 工具模式且焦点不在游戏窗口时的额外帧率限制。
// 默认值:120
fps_max_tools "144"

// CPU 核心使用偏好。
// 默认值:3
//
// <i> >> 某些 CPU 拥有专为高性能设计的核心,以及其他为能效设计的核心。
//        此设置配置工作是被优先分配给哪种类型的核心。最佳设置取决于您的硬件和软件配置。
// <!> >> 需要重启游戏才能生效。
// <i> 该选项仅对支持此设置的 CPU 显示。
//
// <> 数值:
// 0?:仅性能核心。
// 1?:仅能效核心。
// 2?:优先性能核心。
// 3:无偏好。
thread_pool_option "2"

// 将 tick 帧上的低延迟睡眠移到客户端模拟之后。
// 默认值:0
//
// <-> 默认情况下,引擎在处理客户端 tick 之前计算帧间时间。这可能导致玩家位置来自延迟的时间点,
// 尽管他们的输入更加新。此命令将负责睡眠的功能移到 tick 处理之后。这意味着睡眠将更短,
// 因为 tick 处理被包含在时间差中,从而提高了游戏的响应性并减少纹理卡顿。
//
// <!> 需要与启用的 'r_low_latency'(NVIDIA 低延迟)配合使用。
// <!> 应配合帧率限制(封顶的 'fps_max')使用效果更佳。
// <i> 以帧时间一致性为目标的实现。
// <i> 由于其设计机制,可能会导致游戏过程中的不平滑(卡顿)。请注意!应在每个人的具体场景中测试。
engine_low_latency_sleep_after_client_tick "1"

// 控制游戏失焦时引擎每帧睡眠的时间。
// 默认值:20
//
// <-> 通常,切出 CS2 时,引擎会重复睡眠固定毫秒数,以减少功耗和资源占用。
//
// <i> 较高的值可以降低 CPU 负载并省电,但切出时会出现帧率下降,如果 'snd_mute_losefocus 0' 则会出现声音失真。
// <i> 切出时降低帧率,并在任何本地托管的服务器上产生延迟。
// <i> 直播和本地主机推荐使用较低的值(或禁用值)。
engine_no_focus_sleep "15"
