// 移除所有现有的按键绑定。
unbindall

// 将游戏键盘布局更新为当前 Windows 键盘设置。
key_updatelayout

// 将键盘输入直接发送到游戏引擎,不经过操作系统处理。
// 默认值:0
//
// <!> 可能出现意外行为,例如角色随机移动、按键绑定被反转甚至被强制启用。
// <i> 如果在第三方电竞平台上游玩或遇到其他输入问题,启用它可能会缓解问题。
// <i> 可能与第三方客户端产生冲突。
cl_input_enable_raw_keyboard "0"

// 按键盘位置(而不是按键名称)来绑定按键。
// 默认值:1
//
// <i> 扫描码(scancode)是按键在键盘上的物理表示,与语言和键盘映射无关。
input_button_code_is_scan_code_scd "1"

// 栏位绑定。
bind "scancode30"     "slot1"                                   // [1] 装备:主武器。
bind "scancode31"     "slot2"                                   // [2] 装备:副武器(手枪)。
bind "scancode32"     "slot3"                                   // [3] 装备:刀、电击枪或徒手(危险地带)。
bind "scancode33"     "slot4"                                   // [4] 装备:手雷[循环切换](同 'invnextgrenade')。
bind "scancode34"     "slot5"                                   // [5] 装备:C4 炸弹或医疗针。
bind "scancode35"     "slot6"                                   // [6] 装备:高爆手雷或雪球。
bind "scancode36"     "slot7"                                   // [7] 装备:闪光弹。
bind "scancode37"     "slot8"                                   // [8] 装备:烟雾弹。
bind "scancode38"     "slot9"                                   // [9] 装备:诱饵弹。
bind "scancode39"     "slot10"                                  // [0] 装备:燃烧弹/莫洛托夫。

// 移动绑定。
bind "scancode4"      "+left"                                   // [a] 向左平移。
bind "scancode7"      "+right"                                  // [d] 向右平移。
bind "scancode22"     "+back"                                   // [s] 后退。
bind "scancode26"     "+forward"                                // [w] 前进。

bind "mouse_x"        "yaw"                                     // 控制鼠标在垂直轴上的屏幕移动。
bind "mouse_y"        "pitch"                                   // 控制鼠标在水平轴上的屏幕移动。

bind "x_axis"         "rightleft"                               // 控制 X 轴上的屏幕移动。
bind "y_axis"         "!forwardback"                            // 控制 Y 轴上的屏幕移动。
bind "u_axis"         "yaw"                                     // 控制垂直轴上的屏幕移动。
bind "r_axis"         "pitch"                                   // 控制水平轴上的屏幕移动。


// 聊天绑定。
bind "scancode24"     "messagemode2"                            // [y] 队伍消息(仅与队友聊天)。
bind "scancode28"     "messagemode"                             // [u] 全体消息和队伍消息(与所有人聊天)。

// 无线电绑定。
bind "scancode6"      "radio3"                                  // [c] 报告类无线电消息。
bind "scancode27"     "radio2"                                  // [x] 标准无线电消息。
bind "scancode29"     "radio1"                                  // [z] 指挥类无线电消息。
bind "scancode25"     "+voicerecord"                            // [v] 开启语音交流<按住说话;仅在匹配中与队友通话>。

// 其他字母键。
bind "scancode5"      "buymenu"                                 // [b] 打开购买菜单/平板下单(危险地带),购买武器、手雷和装备。
bind "scancode8"      "+use-beep"                               // [e] 执行交互动作并带提示音(如开门、拾取武器、安放炸弹等){脚本}。
bind "scancode9"      "+lookatweapon"                           // [f] 检视当前武器或放下平板(危险地带)。
bind "scancode10"     "drop"                                    // [g] 丢弃当前武器。
bind "scancode11"     "+radialradio"                            // [h] 轮盘无线电菜单{脚本}。
bind "scancode12"     ""                                        // [i] -
bind "scancode13"     "+bomb-drop"                              // [j] 快速丢包{脚本}。
bind "scancode14"     "callvote"                                // [k] 打开投票菜单。
bind "scancode15"     "observed-crosshair"                      // [l] 切换观战对象的准星。
bind "scancode16"     "teammenu"                                // [m] 打开队伍选择菜单和平板(危险地带)。
bind "scancode17"     "-attack"                                 // [n] 手动跳投(与跳跃键配合使用)。
bind "scancode18"     "toggleradarscale"                        // [o] 切换雷达替代缩放的显示。
bind "scancode19"     "toggle spec_show_xray"                   // [p] 切换观战时的 X 光透视。
bind "scancode20"     "+quick-switch"                           // [q] 快速切换:当前武器 → 刀/电击枪 → 当前武器{脚本}。
bind "scancode21"     "+reload"                                 // [r] 装填当前武器。
bind "scancode23"     "+spray_menu"                             // [t] 打开喷漆菜单,在准星所指的表面上喷漆。


// 特殊按键。
bind "scancode41"     "cancelselect"                            // [esc] 打开/关闭游戏菜单。
bind "scancode43"     "+scores-fps"                             // [tab] 显示计分板或平板,同时显示 FPS<按住显示>(危险地带){脚本}。
bind "scancode57"     ""                                        // [capslock] -
bind "scancode225"    "+sprint"                                 // [shift] 静步走(减速;无声)。
bind "scancode229"    ""                                        // [rshift] -
bind "scancode224"    "+duck"                                   // [ctrl] 蹲伏;在危险地带中,先按蹲再跳可与跳跃鞋配合进行远跳。
bind "scancode228"    ""                                        // [rctrl] -
bind "scancode226"    "+secondbinds"                            // [alt] 切换第二套按键<按住激活>{脚本}。
bind "scancode230"    ""                                        // [ralt] -
bind "scancode44"     "+jump"                                   // [space] 跳跃<按住可与跳跃鞋配合跳得更高>(危险地带){脚本}。
bind "scancode40"     ""                                        // [enter] -
bind "scancode42"     ""                                        // [backspace] -
bind "scancode73"     ""                                        // [ins] -
bind "scancode76"     "sellbackall"                             // [del] 退还本回合购买的所有物品。
bind "scancode74"     ""                                        // [home] -
bind "scancode77"     ""                                        // [end] -
bind "scancode75"     "exec arminc/audio.cfg"                   // [pgup] 执行默认音频设置(恢复声音)。
bind "scancode78"     "volume 0"                                // [pgdn] 静音。
bind "scancode71"     ""                                        // [sclk] -
bind "scancode72"     ""                                        // [pause] -

// 标点键。
bind "scancode53"     "toggleconsole"                           // [`] 打开开发者控制台。
bind "scancode54"     "switchhands"                             // [,] 切换视角模型的持枪手。
bind "scancode55"     ""                                        // [.] -
bind "scancode56"     "exec userconfig.cfg"                     // [/] 执行自定义的 userconfig.cfg。
bind "scancode51"     "noclip"                                  // [;] 切换穿墙能力(需要 sv_cheats)。
bind "scancode52"     "player_ping"                             // ['] 在准星所指位置生成一个视觉标记(可用作宏绑定)。
bind "scancode49"     ""                                        // [\] -
bind "scancode47"     "debug-hud"                               // ([) 开启视觉(HUD)调试{脚本}。
bind "scancode48"     "debug-console"                           // (]) 在控制台输出调试信息{脚本}。
bind "scancode45"     "slot11"                                  // [-] 装备:电击枪。
bind "scancode46"     "slot12"                                  // [backspace] 装备:医疗针。

// 光标控制键。
bind "scancode82"     "+forward"                                // [uparrow] 前进。
bind "scancode81"     "+back"                                   // [downarrow] 后退。
bind "scancode80"     "+turnleft"                               // [leftarrow] 向左旋转(逆时针)。
bind "scancode79"     "+turnright"                              // [rightarrow] 向右旋转(顺时针)。

// 鼠标按键。
bind "mwheelup"       "+jump"                                   // 向上滚动滚轮跳跃。
bind "mwheeldown"     "+jump"                                   // 向下滚动滚轮跳跃。
bind "mouse1"         "+attack"                                 // 射击、安放炸弹、注射医疗针、向前循环切换、出快拳(危险地带)。
bind "mouse2"         "+attack2"                                // 开镜、切换消音器/三连发、向后循环切换、出蓄力拳(危险地带)。
bind "mouse3"         ""                                        // -
bind "mouse4"         "player_ping"                             // 在准星所指位置生成一个视觉标记。
bind "mouse5"         "+secondbinds"                            // 切换第二套按键<按住激活>{脚本}。

// 功能键。
bind "scancode58"     ""                                        // [f1] -
bind "scancode59"     ""                                        // [f2] -
bind "scancode60"     "autobuy"                                 // [f3] 在死斗模式中启用/禁用自动购买。
bind "scancode61"     "afk-move"                                // [f4] 切换挂机自动行走(逆时针转圈移动){脚本}。
bind "scancode62"     "clutch_mode_toggle; select"              // [f5] 切换残局模式(静音队友直到下一回合或死亡){使用音效}。
bind "scancode63"     "mute-enemy-team"                         // [f6] 切换静音敌方队伍通讯(同时禁用敌方聊天){脚本}。
bind "scancode64"     "ignore-messages"                         // [f7] 切换聊天消息(禁用范围:1 - 敌方,2 - 敌方与队友,3 - 全部){脚本}。
bind "scancode65"     "ignore-radio"                            // [f8] 切换无线电消息{脚本}。
bind "scancode66"     "fixer"                                   // [f9] 执行修复器,可修复图形故障、声音故障、HUD 错误等{脚本}。
bind "scancode67"     ""                                        // [f10] -
bind "scancode68"     ""                                        // [f11] -
bind "scancode69"     ""                                        // [f12] -

// 小键盘数字键。
//
// <> 物品别名:
// 手枪:glock(格洛克), hkp2000(双持贝瑞塔), usp_silencer(消音 USP), elite(双持精英), p250, tec9, fn57, deagle(沙漠之鹰) { (I) CZ75-Auto 使用 'tec9' 或 'fn57'; (II) R8 左轮手枪 使用 'deagle' }
// 步枪:galilar(加利尔), famas(法玛斯), ak47, m4a1, m4a1_silencer(消音 M4A1-S), ssg08, aug, sg556, awp, scar20, g3sg1 { (I) M4A4、M4A1-S、AK-47 分别使用 'm4a1'、'm4a1_silencer'、'ak47' }
// 重武器:nova(新星), xm1014, mag7, m249, negev(内格夫) { (I) 锯短猎枪(Sawed-Off)使用 'mag7' }
// 冲锋枪:mac10, mp9, mp7, ump45, p90, bizon(野牛) { (I) MP5-SD 使用 'mp7' }
// 装备:vest(防弹衣), vesthelm(防弹衣+头盔), taser(电击枪), defuser(拆弹钳), heavyarmor(重型护甲)
// 手雷:molotov(莫洛托夫), incgrenade(燃烧弹), decoy(诱饵弹), flashbang(闪光弹), hegrenade(高爆手雷), smokegrenade(烟雾弹), tagrenade(战术手雷)
//
// <> 默认购买列表(从上到下):
// 装备:vest(防弹衣), vesthelm(防弹衣+头盔), taser(电击枪), defuser(拆弹钳)
// 手枪:hpk2000/usp_silencer/glock(双持贝瑞塔/消音USP/格洛克), elite(双持精英), p250, fn57/tec9, deagle(沙漠之鹰)
// 中档:nova(新星), xm1041, mp5sd, p90, mp9/mac10
// 步枪:famas/galilar(法玛斯/加利尔), m4a1/m4a1_silencer/ak47, ssg08, aug/sg556, awp
// 手雷:flashbang(闪光弹), smokegrenade(烟雾弹), hegrenade(高爆手雷), incgrenade(燃烧弹), decoy(诱饵弹)
//
// <i> 在另一阵营名称不同的物品,可以通过对方阵营的别名购买。
// <i> 购买物品后会自动装备刀,便于开局跑图。
bind "scancode83"     ""                                        // [numlock] -
bind "scancode84"     "buy hegrenade; slot3"                    // [/] 购买:高爆手雷。
bind "scancode85"     "buy flashbang; slot3"                    // [*] 购买:闪光弹。
bind "scancode86"     "buy smokegrenade; slot3"                 // [-] 购买:烟雾弹。
bind "scancode87"     "buy incgrenade; slot3"                   // [+] 购买:燃烧弹/莫洛托夫。
bind "scancode88"     "buy defuser; slot3"                      // [enter] 购买:拆弹钳。
bind "scancode99"     "buy vest; slot3"                         // [.] 购买:防弹衣。
bind "scancode98"     "buy vesthelm; slot3"                     // [0] 购买:防弹衣+头盔。
bind "scancode89"     "buy secondary1; slot3"                   // [1] 购买:手枪 2(从"其他手枪"类别开始)。
bind "scancode90"     "buy secondary2; slot3"                   // [2] 购买:手枪 3。
bind "scancode91"     "buy secondary3; slot3"                   // [3] 购买:手枪 4。
bind "scancode92"     "buy midtier0; slot3"                     // [4] 购买:中档武器 1。
bind "scancode93"     "buy midtier1; slot3"                     // [5] 购买:中档武器 2。
bind "scancode94"     "buy midtier2; slot3"                     // [6] 购买:中档武器 3。
bind "scancode95"     "buy rifle0; slot3"                       // [7] 购买:步枪 1。
bind "scancode96"     "buy rifle1; slot3"                       // [8] 购买:步枪 2。
bind "scancode97"     "buy rifle2; slot3"                       // [9] 购买:步枪 3。

// 轮盘无线电。
cl_radial_radio_tab_0_text_1 "#Chatwheel_midplan"              // 标记中路。
cl_radial_radio_tab_0_text_2 "#Chatwheel_bplan"                // 标记 B 点。
cl_radial_radio_tab_0_text_3 "#Chatwheel_oneenemyhere"         // 标记"这里有一个敌人"。
cl_radial_radio_tab_0_text_4 "#Chatwheel_requestplan"          // 询问战术计划。
cl_radial_radio_tab_0_text_5 "#Chatwheel_requestweapon"        // 请求武器。
cl_radial_radio_tab_0_text_6 "#Chatwheel_rotatetome"           // 呼叫队友转点。
cl_radial_radio_tab_0_text_7 "#Chatwheel_heardnoise"           // 呼叫有声音。
