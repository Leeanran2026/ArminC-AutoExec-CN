// 防止购买轮盘通过数字键购买。
// 默认值:0
cl_buywheel_nonumberpurchasing "1"

// 开镜键防抖。
// 默认值:1
//
// >> 按住开镜键时应表现得像反复按动一样。
//
// <> 数值:
// 0:反复开镜。
// 1:单击开镜。
cl_debounce_zoom "0"

// 在支持的武器上拆卸消音器。
// 默认值:0
//
// >> 拆卸 M4A1-S 和 USP-S 上的消音器。
//
// <> 数值:
// 0:无法拆卸。
// 1:按副射击键拆卸。
cl_silencer_mode "1"

// 在购买区域内按 +use 键将打开购买菜单(就像按了 'buy' 键一样)。
// 默认值:1
cl_use_opens_buy_menu "0"

// 在计分板中启用鼠标选择的绑定按键类型。
// 默认值:+attack2
cl_scoreboard_mouse_enable_binding "+attack2"

// 设置购买菜单中用于捐赠的按键。
// 默认值:0
//
// <> 数值:
// 0:左 Ctrl。
// 1:左 Alt。
// 2:左 Shift。
cl_buywheel_donate_key "0"

// 蹲伏方式。
// 默认值:0
//
// <> 数值:
// 0:按住蹲伏。
// 1:按键切换蹲伏。
option_duck_method "0"

// 静步方式。
// 默认值:0
//
// <> 数值:
// 0:按住静步。
// 1:按键切换静步。
option_speed_method "0"

// 下落速度超过致命极限时自动打开降落伞。
// 默认值:1
cl_parachute_autodeploy "1"

// 轻按轮盘无线电按钮时,如果在 'cl_radial_menu_tap_duration' 设置的秒数内未选择任何选项,则留下一个标记。
// 默认值:1
cl_radial_radio_tap_to_ping "1"

// 摇杆游戏引擎控制器支持。
// 默认值:0
joystick "0"

// 游戏内摇杆输入识别。
// 默认值:0
cl_joystick_enabled "0"
