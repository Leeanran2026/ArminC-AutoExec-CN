// 准星开关。
// 默认值:1
crosshair "1"

// 准星类型。
// 默认值:2
//
// <> 数值:
// 0:Scaleform 默认   - 大型动态 Scaleform 准星(仅可用 cl_crosshaircolor 自定义)。
// 1:Scaleform 小型   - 小型静态 Scaleform 准星(仅可用 cl_crosshaircolor 和 cl_fixedcrosshairgap 自定义)。
// 2:经典             - 移动时准星略带动态,开火时提供分离的反馈(固定内环,精确的弹道散布反馈)。
// 3:经典动态         - 移动时准星非常动态,开火时提供平滑反馈(精确的弹道散布反馈)。
// 4:经典静态         - 移动和开火时准星都保持静态。
// 5:经典动态'1.6'    - 移动时静态,开火时平滑扩大(虚假后坐力 - 不准确的反馈)。
cl_crosshairstyle "4"

// 跟随后坐力。
// 默认值:1
//
// >> 准星将离开屏幕中心,跟随武器的后坐力轨迹。
cl_crosshair_recoil "0"

// 准星线条的长度。
// 默认值:10
cl_crosshairsize "2.3"

// 准星线条的粗细。
// 默认值:0.6
//
// <i> 如果 'cl_crosshairdot 1',也会改变中心点的大小。
cl_crosshairthickness "0.5"

// 准星线条之间的中心间距。
// 默认值:-2.2
cl_crosshairgap "-3"

// 根据当前装备的武器动态更新间距。
// 默认值:1
cl_crosshairgap_useweaponvalue "0"

// 刻度之间间距的大小。
// 默认值:3
//
// <!> 仅适用于 'cl_crosshairstyle 1'。
cl_fixedcrosshairgap "-2"


// 准星中心点。
// 默认值:1
//
// <i> 用 cl_crosshairthickness 调整大小。
cl_crosshairdot "0"

// T 型准星。
// 默认值:0
//
// <-> 移除准星上方的线条。
// <!> 仅适用于 'cl_crosshairstyle' 从 '2' 到 '5'。
cl_crosshair_t "0"

// 为准星绘制黑色轮廓,以获得更好的可见性。
// 默认值:1
cl_crosshair_drawoutline "0"

// 设置准星轮廓的绘制粗细。
// 默认值:1
cl_crosshair_outlinethickness "2"

// 准星线条的透明度开关。
// 默认值:1
//
// <> 数值:
// 0:半透明准星。
// 1:通过 'cl_crosshairalpha' 设置透明度。
cl_crosshairusealpha "1"

// 准星线条的透明度值。
// 默认值:200
//
// <> 数值:
// 0:完全透明。
// |
// 255:完全不透明。
cl_crosshairalpha "250"

// 设置 game_options.consoles.txt 中定义的准星颜色。
// 默认值:1
//
// <> 数值:
// Scaleform:0=###       1=绿色     2=黄色     3=蓝色     4=青色     5=红色
// Classic:   0=红色      1=绿色     2=黄色     3=蓝色     4=青色     5=自定义
cl_crosshaircolor "1"

// 颜色面板。
//
// <!> 仅适用于 'cl_crosshaircolor 5'。
// <i> 也会影响 ACOG 准星点的颜色(开镜的 AUG/SG553)。
//
// * 红色
// 默认值:50
cl_crosshaircolor_R "0"
// * 绿色
// 默认值:250
cl_crosshaircolor_G "255"
// * 蓝色
// 默认值:50
cl_crosshaircolor_B "0"

// 显示敌人的名字。
// 默认值:1
//
// <i> 如果准星对准敌人实体,将出现带有敌人名字的红色文本。
hud_showtargetid "1"

// 友军准星悬停警告。
// 默认值:1
//
// <> 数值:
// 0:禁用
// 1:仅在默认准星样式上('cl_crosshairstyle' - '0' 或 '1')。
// 2:始终启用。
cl_crosshair_friendly_warning "1"

// 控制观战机器人时显示的准星。
// 默认值:0
//
// <> 数值:
// 0:显示玩家准星。
// 1:仅当机器人可以被接管时显示玩家准星,否则显示默认准星。
// 2:机器人始终显示默认准星。
cl_observed_bot_crosshair "1"

// ACOG 滤镜透明度(开镜镜头)。
// 默认值:1
//
// <> 数值:
// 1.0:完全染色。
// |
// 0:无染色,清晰视野。
cl_ironsight_filter_alpha "0"

// ACOG 准星点颜色通道(开镜镜头准星)。
// 默认值:0.3
//
// <> 数值:
// 1.0:饱和白色
// |
// 0:饱和绿色
cl_ironsight_min_channel_color "0"

// 让 ACOG 准星点颜色与准星颜色一致。
// 默认值:0
cl_ironsight_usecrosshaircolor "0"

// 狙击镜十字线宽度。
// 默认值:1
//
// <> 数值:
//  1:单像素细线。
// >1:每个数字额外增加 1 宽度。
cl_crosshair_sniper_width "1"

// 决定内外准星线条长度的比例。
// 默认值:1
//
// 内线 = cl_crosshairsize * (1 - cl_crosshair_dynamic_maxdist_splitratio)
// 外线 = cl_crosshairsize * cl_crosshair_dynamic_maxdist_splitratio
//
// <!> 仅适用于 cl_crosshairstyle '2'。
cl_crosshair_dynamic_maxdist_splitratio "2"

// 内准星线条分裂后使用的透明度修正。
// 默认值:0
//
// <!> 仅适用于 'cl_crosshairstyle 2'。
cl_crosshair_dynamic_splitalpha_innermod "0"

// 外准星线条分裂后使用的透明度修正。
// 默认值:1
//
// <!> 仅适用于 'cl_crosshairstyle 2'。
cl_crosshair_dynamic_splitalpha_outermod "1"

// 准星线条分裂为 2 的距离(开火或移动时)。
// 默认值:3
//
// <!> 仅适用于 'cl_crosshairstyle 2'。
cl_crosshair_dynamic_splitdist "3"

// 装备诱饵弹时显示可自定义的手雷准星。
// 默认值:1
cl_grenadecrosshair_decoy "0"

// 装备高爆手雷时显示可自定义的手雷准星。
// 默认值:1
cl_grenadecrosshair_explosive "1"

// 装备莫洛托夫/燃烧弹时显示可自定义的手雷准星。
// 默认值:1
cl_grenadecrosshair_fire "1"

// 装备闪光弹时显示可自定义的手雷准星。
// 默认值:1
cl_grenadecrosshair_flash "1"

// 装备烟雾弹时显示可自定义的手雷准星。
// 默认值:1
cl_grenadecrosshair_smoke "1"

// 手持手雷时保留常规准星(否则替换为特定的手雷投掷参考准星)。
// 默认值:1
cl_grenadecrosshair_keepusercrosshair "0"

// 调整可自定义手雷准星的时机,影响拔出诱饵弹拉环后准星反映变化的速度。
// 默认值:2
cl_grenadecrosshairdelay_decoy "2"

// 调整可自定义手雷准星的时机,影响拔出高爆手雷拉环后准星反映变化的速度。
// 默认值:2
cl_grenadecrosshairdelay_explosive "2"

// 调整可自定义手雷准星的时机,影响拔出莫洛托夫/燃烧弹拉环后准星反映变化的速度。
// 默认值:2
cl_grenadecrosshairdelay_fire "2"

// 调整可自定义手雷准星的时机,影响拔出闪光弹拉环后准星反映变化的速度。
// 默认值:2
cl_grenadecrosshairdelay_flash "2"

// 调整可自定义手雷准星的时机,影响拔出烟雾弹拉环后准星反映变化的速度。
// 默认值:2
cl_grenadecrosshairdelay_smoke "2"
